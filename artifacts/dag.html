<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>AI-Workflow Visualizer — repo-migration-engine</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --completed: #10b981;
      --running: #f59e0b;
      --failed: #ef4444;
      --gate-color: #8b5cf6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    header { height: 60px; background: #0f172a; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 10; }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .title { font-size: 16px; font-weight: 700; color: var(--accent); }
    .metrics { font-size: 13px; color: var(--text-muted); background: #1e293b; padding: 4px 12px; border-radius: 9999px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    button { background: #1e293b; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    button:hover { background: #334155; }
    #canvas-container { flex: 1; position: relative; overflow: hidden; cursor: grab; }
    #canvas-container:active { cursor: grabbing; }
    svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .phase-column { fill: #0f172a; stroke: var(--border); stroke-dasharray: 4; rx: 8; opacity: 0.6; }
    .phase-label { font-size: 14px; font-weight: 600; fill: var(--text-muted); text-anchor: middle; }
    .node-card { fill: var(--card-bg); stroke: var(--border); rx: 8; cursor: pointer; transition: stroke 0.2s; }
    .node-card:hover { stroke: var(--accent); }
    .node-card.completed { stroke: var(--completed); }
    .node-card.running { stroke: var(--running); stroke-width: 2; }
    .node-card.failed { stroke: var(--failed); }
    .node-card.gate { stroke: var(--gate-color); }
    .node-title { font-size: 12px; font-weight: 600; fill: var(--text); }
    .node-role { font-size: 10px; fill: var(--text-muted); }
    .node-badge { font-size: 10px; font-weight: bold; }
    .bezier-edge { fill: none; stroke: #334155; stroke-width: 2; transition: stroke 0.2s; }
    .bezier-edge.active { stroke: var(--accent); stroke-dasharray: 6; animation: dash 1s linear infinite; }
    .bezier-edge.completed { stroke: var(--completed); stroke-width: 2.5; }
    .bezier-edge.failed { stroke: var(--failed); }
    @keyframes dash { to { stroke-dashoffset: -12; } }
    #drawer { position: fixed; top: 60px; right: -420px; width: 420px; height: calc(100vh - 60px); background: #0f172a; border-left: 1px solid var(--border); transition: right 0.25s ease; padding: 24px; overflow-y: auto; z-index: 20; }
    #drawer.open { right: 0; }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    pre { background: #090d16; padding: 12px; border-radius: 6px; font-size: 11px; color: #a5b4fc; overflow-x: auto; margin-top: 8px; }
  </style>
</head>
<body>

      <div class="title">AI-Workflow Visualizer</div>
      <div class="metrics status-bar" id="metrics-label">

      <button onclick="resetZoom()">重置缩放</button>

          <path d="M 920 477.5 C 970 477.5, 970 132.5, 1020 132.5"

          <path d="M 920 707.5 C 970 707.5, 970 132.5, 1020 132.5"

          <path d="M 1240 132.5 C 1290 132.5, 1290 132.5, 1340 132.5"

        <!-- Nodes -->
        
          <g onclick="inspectNode('step-1-baseline-gate')">

          <g onclick="inspectNode('step-3c-reviewer-sqs')">

            <text x="714" y="691" class="node-title">Paired Code Review & AST Verification (CodeReviewerAgent - SQS)</text>
            <text x="714" y="711" class="node-role">

            <text x="896" y="691" class="node-badge" fill="#94a3b8">

          <g onclick="inspectNode('step-4-post-merge-gate')">

  <div id="drawer">
    <div class="drawer-header">
      <h3 id="drawer-title">Node Inspector</h3>
      <button onclick="closeDrawer()">✕</button>
    </div>
    <div id="drawer-content"></div>
  </div>

  <script>
    const nodes = [{"id":"step-1-baseline-gate","name":"Verify Clean Repository Baseline Gate","phaseId":"phase-1-baseline-gate","phaseName":"Baseline Test Gate","role":"gate","type":"gate","status":"pending","dependsOn":[],"x":60,"y":90,"width":220,"height":85},{"id":"step-2a-ast-scan","name":"Deterministic AST Codebase Scanner","phaseId":"phase-2-ast-scan-arch","phaseName":"AST Scan & Migration Architecture","role":"inspector","type":"probe","status":"pending","dependsOn":["step-1-baseline-gate"],"x":380,"y":90,"width":220,"height":85},{"id":"step-2b-architect","name":"Migration Architecture & Topological Ordering (MigrationArchitectAgent)","phaseId":"phase-2-ast-scan-arch","phaseName":"AST Scan & Migration Architecture","role":"coordinator","type":"action","status":"pending","dependsOn":["step-2a-ast-scan"],"x":380,"y":205,"width":220,"height":85},{"id":"step-3a-worker-s3","name":"Transform S3 Client Service (CodeTransformerAgent - S3)","phaseId":"phase-3-parallel-transform","phaseName":"Parallel Fan-Out Workers & Paired Code Reviewers","role":"worker","type":"action","status":"pending","dependsOn":["step-2b-architect"],"x":700,"y":90,"width":220,"height":85},{"id":"step-3a-reviewer-s3","name":"Paired Code Review & AST Verification (CodeReviewerAgent - S3)","phaseId":"phase-3-parallel-transform","phaseName":"Parallel Fan-Out Workers & Paired Code Reviewers","role":"reviewer","type":"action","status":"pending","dependsOn":["step-3a-worker-s3"],"x":700,"y":205,"width":220,"height":85},{"id":"step-3b-worker-dynamo","name":"Transform DynamoDB Client Service (CodeTransformerAgent - DynamoDB)","phaseId":"phase-3-parallel-transform","phaseName":"Parallel Fan-Out Workers & Paired Code Reviewers","role":"worker","type":"action","status":"pending","dependsOn":["step-2b-architect"],"x":700,"y":320,"width":220,"height":85},{"id":"step-3b-reviewer-dynamo","name":"Paired Code Review & AST Verification (CodeReviewerAgent - DynamoDB)","phaseId":"phase-3-parallel-transform","phaseName":"Parallel Fan-Out Workers & Paired Code Reviewers","role":"reviewer","type":"action","status":"pending","dependsOn":["step-3b-worker-dynamo"],"x":700,"y":435,"width":220,"height":85},{"id":"step-3c-worker-sqs","name":"Transform SQS Client Service (CodeTransformerAgent - SQS)","phaseId":"phase-3-parallel-transform","phaseName":"Parallel Fan-Out Workers & Paired Code Reviewers","role":"worker","type":"action","status":"pending","dependsOn":["step-2b-architect"],"x":700,"y":550,"width":220,"height":85},{"id":"step-3c-reviewer-sqs","name":"Paired Code Review & AST Verification (CodeReviewerAgent - SQS)","phaseId":"phase-3-parallel-transform","phaseName":"Parallel Fan-Out Workers & Paired Code Reviewers","role":"reviewer","type":"action","status":"pending","dependsOn":["step-3c-worker-sqs"],"x":700,"y":665,"width":220,"height":85},{"id":"step-4-post-merge-gate","name":"Compiler Diagnostics & Post-Merge Verification Gate","phaseId":"phase-4-post-merge-gate","phaseName":"Compiler Diagnostics & Post-Merge Test Gate","role":"gate","type":"gate","status":"pending","dependsOn":["step-3a-reviewer-s3","step-3b-reviewer-dynamo","step-3c-reviewer-sqs"],"x":1020,"y":90,"width":220,"height":85},{"id":"step-5-summary","name":"Release Synthesis & PR Generation (MigrationSummaryAgent)","phaseId":"phase-5-release-synthesis","phaseName":"Release Synthesis & PR Generation","role":"coordinator","type":"action","status":"pending","dependsOn":["step-4-post-merge-gate"],"x":1340,"y":90,"width":220,"height":85}];
    let scale = 1, panX = 0, panY = 0, isDragging = false, startX, startY;
    const group = document.getElementById('transform-group');
    const container = document.getElementById('canvas-container');

    container.addEventListener('mousedown', e => {
      if (e.target.tagName === 'button' || e.target.closest('#drawer')) return;
      isDragging = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => isDragging = false);

    container.addEventListener('wheel', e => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      scale = Math.min(Math.max(scale * zoomFactor, 0.2), 3.0);
      updateTransform();
    });

    function updateTransform() {
      group.setAttribute('transform', `translate(${panX}, ${panY}) scale(${scale})`);
    }

    function resetZoom() {
      scale = 1; panX = 0; panY = 0;
      updateTransform();
    }

    function inspectNode(id) {
      const node = nodes.find(n => n.id === id);
      if (!node) return;
      document.getElementById('drawer-title').innerText = node.name;
      document.getElementById('drawer-content').innerHTML = `
        <p><strong>Role:</strong> ${node.role}</p>
        <p><strong>Status:</strong> ${node.status}</p>
        <p><strong>Phase:</strong> ${node.phaseName}</p>
        <p><strong>Duration:</strong> ${node.durationMs || 0}ms</p>
        <h4 style="margin-top:16px;">Inputs</h4>
        <pre>${JSON.stringify(node.inputs || {}, null, 2)}</pre>
        <h4 style="margin-top:16px;">Outputs</h4>
        <pre>${JSON.stringify(node.outputs || {}, null, 2)}</pre>
      `;
      document.getElementById('drawer').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open');
    }

    function toggleLang() {
      const url = new URL(window.location);
      url.searchParams.set('lang', 'en');
      window.location = url.toString();
    }
  </script>
</body>
</html>

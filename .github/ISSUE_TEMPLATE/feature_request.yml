name: "✨ 功能特性 (Feature Request)"
description: "提议新的功能特性或增强现有功能"
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交功能特性提案！请依照以下大厂工程规范详述背景、设计思路与验收标准（DoD）。
  - type: textarea
    id: background
    attributes:
      label: "1. 业务背景与目标 (Background & Objective)"
      description: "清晰描述为什么需要该特性？解决了什么痛点？"
      placeholder: "例如：当前多 Agent 流程在协同合入时缺少集中门禁，导致脏提交混入主分支..."
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: "2. 设计方案与受影响范围 (Design & Scope)"
      description: "具体涉及哪些模块、接口或规范文件的调整？"
      placeholder: "涉及模块：src/dwf/...，文档：docs/WORKFLOW.md..."
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: "3. 验收标准 (Acceptance Criteria / DoD)"
      description: "可机械验证的交付判据（必须可复核）"
      value: |
        - [ ] 改动遵循最小改动原则，无无关代码夹带
        - [ ] 新建独立 Worktree 进行隔离开发
        - [ ] 本机全套验证（构建、单元测试、PBT 测试、E2E 测试）通过
        - [ ] 编写对应的自动化测试与门禁锁定
    validations:
      required: true

# AI-Workflow CI — mirrors the local gate chain (AGENTS.md §四) on Linux.
#
# Restored 2026-11-14 by user decision (Issue #7): the competition repo is
# PUBLIC, so GitHub Actions usage is free (runner minutes are billed for
# private repositories only) and Linux-side verification had zero coverage.
# The original removal (2026-11-09, private-repo Issue #203) was driven by
# private-repo quota exhaustion; that constraint no longer applies here.
#
# Merge admission is still governed by the local gates + pr_review_gate.mjs;
# this workflow is the public trust signal and the cross-platform check.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc)
        run: npm run build

      - name: Unit suite
        run: npm run test:unit

      - name: Integration suite (serial)
        run: npm run test:integration

      - name: Property-based tests
        run: npm run test:pbt

      - name: Governance locks
        run: npm run test:governance

      - name: E2E suite
        run: npm run test:e2e

      - name: Adversarial suite
        run: npm run test:adversarial

      - name: Nine-act demo (offline, self-verifying)
        run: bash scripts/demo.sh

  # Issue #173 (DoD 3, fulfilling the #124 "mechanical closure" promise): the
  # §1.9 review-adjudication trio (issue linkage + review-comment replies + S2
  # no-comment claims) now runs as a REQUIRED CI job on every PR update, so an
  # unanswered supervision finding is visibly RED on GitHub — not just at
  # merge time via pr_merge.sh. The job intentionally runs the gate script
  # from MAIN (this checkout), never from the PR head: PR-author-controlled
  # gate code would be self-certifying. Merge-time-only checks (cooling,
  # fingerprint/tap binding, failure naming) stay with pr_merge.sh's bare
  # [1/5] run — a WIP PR legitimately has no final fingerprint yet.
  # NOTE: this job's checks are advisory against the last push; comments that
  # land after CI are caught mechanically by review-comments-status.yml
  # (issue_comment → HEAD sha status flip) plus pr_merge.sh at merge time.
  review-comments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: §1.9 adjudication (linkage + review replies + no-comment claims)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pr_review_gate.mjs "${{ github.event.pull_request.number }}" --ci-comments

  # Issue #66: a SIGNAL job, not a gate. Quantified at triage: 9
  # `process.platform === 'win32'` branches across src/ plus 2 win32/ps1/
  # jobhelper tracked files (scripts/win32-jobhelper.cs,
  # tests/integration/win32-spawn-resolver.test.ts) — single digits, so a
  # full windows matrix would roughly double every PR's wall clock while
  # P-SHELL-1 / pipe-buffering / jobhelper compile risks would make it a
  # merge-blocking hazard on its first red. This job runs the cheap
  # build+unit slice on demand (workflow_dispatch) or when a PR carries the
  # `win32` label, gathering signal without gating merges. Branch protection
  # (Issue #66 action item 3) requires only the `gate` context above.
  win32-signal:
    runs-on: windows-latest
    timeout-minutes: 40
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'win32')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc)
        run: npm run build

      - name: Unit suite
        run: npm run test:unit

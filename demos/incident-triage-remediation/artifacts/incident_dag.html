<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>AI-Workflow Visualizer — incident-triage-remediation</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --border: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --completed: #10b981;
      --running: #f59e0b;
      --failed: #ef4444;
      --gate-color: #8b5cf6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    header { height: 60px; background: #0f172a; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 10; }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .title { font-size: 16px; font-weight: 700; color: var(--accent); }
    .metrics { font-size: 13px; color: var(--text-muted); background: #1e293b; padding: 4px 12px; border-radius: 9999px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    button { background: #1e293b; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    button:hover { background: #334155; }
    #canvas-container { flex: 1; position: relative; overflow: hidden; cursor: grab; }
    #canvas-container:active { cursor: grabbing; }
    svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .phase-column { fill: #0f172a; stroke: var(--border); stroke-dasharray: 4; rx: 8; opacity: 0.6; }
    .phase-label { font-size: 14px; font-weight: 600; fill: var(--text-muted); text-anchor: middle; }
    .node-card { fill: var(--card-bg); stroke: var(--border); rx: 8; cursor: pointer; transition: stroke 0.2s; }
    .node-card:hover { stroke: var(--accent); }
    .node-card.completed { stroke: var(--completed); }
    .node-card.running { stroke: var(--running); stroke-width: 2; }
    .node-card.failed { stroke: var(--failed); }
    .node-card.gate { stroke: var(--gate-color); }
    .node-title { font-size: 12px; font-weight: 600; fill: var(--text); }
    .node-role { font-size: 10px; fill: var(--text-muted); }
    .node-badge { font-size: 10px; font-weight: bold; }
    .bezier-edge { fill: none; stroke: #334155; stroke-width: 2; transition: stroke 0.2s; }
    .bezier-edge.active { stroke: var(--accent); stroke-dasharray: 6; animation: dash 1s linear infinite; }
    .bezier-edge.completed { stroke: var(--completed); stroke-width: 2.5; }
    .bezier-edge.failed { stroke: var(--failed); }
    @keyframes dash { to { stroke-dashoffset: -12; } }
    #drawer { position: fixed; top: 60px; right: -420px; width: 420px; height: calc(100vh - 60px); background: #0f172a; border-left: 1px solid var(--border); transition: right 0.25s ease; padding: 24px; overflow-y: auto; z-index: 20; }
    #drawer.open { right: 0; }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    pre { background: #090d16; padding: 12px; border-radius: 6px; font-size: 11px; color: #a5b4fc; overflow-x: auto; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="title">AI-Workflow Visualizer</div>
      <div class="metrics status-bar" id="metrics-label">
        5 phases · 5 个阶段 · 0 个智能体并行执行中
      </div>
    </div>
    <div class="header-right">
      <button onclick="resetZoom()">重置缩放</button>
      <button onclick="toggleLang()">English</button>
    </div>
  </header>

  <div id="canvas-container">
    <svg id="svg-canvas" viewBox="0 0 1680 360">
      <defs>
        <marker id="arrow-completed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
        </marker>
        <marker id="arrow-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
        </marker>
        <marker id="arrow-pending" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
        </marker>
        <marker id="arrow-failed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
        </marker>
      </defs>

      <g id="transform-group">
        <!-- Phase Columns -->
        
          <rect x="40" y="30" width="260" height="310" class="phase-column" />
          <text x="170" y="60" class="phase-label">Detection & Telemetry Probing</text>
        
          <rect x="360" y="30" width="260" height="310" class="phase-column" />
          <text x="490" y="60" class="phase-label">Triage & Root Cause Analysis</text>
        
          <rect x="680" y="30" width="260" height="310" class="phase-column" />
          <text x="810" y="60" class="phase-label">Remediation Synthesis & Safety Pair Review</text>
        
          <rect x="1000" y="30" width="260" height="310" class="phase-column" />
          <text x="1130" y="60" class="phase-label">Execution & Verification Test Gate</text>
        
          <rect x="1320" y="30" width="260" height="310" class="phase-column" />
          <text x="1450" y="60" class="phase-label">Post-Mortem Synthesis & Live Dashboard Export</text>
        

        <!-- Curved Bézier Edges -->
        
          <path d="M 280 132.5 C 330 132.5, 330 132.5, 380 132.5"
                class="bezier-edge pending"
                marker-end="url(#arrow-pending)" />
        
          <path d="M 600 132.5 C 650 132.5, 650 132.5, 700 132.5"
                class="bezier-edge pending"
                marker-end="url(#arrow-pending)" />
        
          <path d="M 920 132.5 C 1030 132.5, 590 247.5, 700 247.5"
                class="bezier-edge pending"
                marker-end="url(#arrow-pending)" />
        
          <path d="M 920 247.5 C 970 247.5, 970 132.5, 1020 132.5"
                class="bezier-edge pending"
                marker-end="url(#arrow-pending)" />
        
          <path d="M 1240 132.5 C 1290 132.5, 1290 132.5, 1340 132.5"
                class="bezier-edge pending"
                marker-end="url(#arrow-pending)" />
        

        <!-- Nodes -->
        
          <g onclick="inspectNode('step-1-probe')">
            <rect x="60" y="90" width="220" height="85"
                  class="node-card pending " />
            <text x="74" y="116" class="node-title">Deterministic Telemetry & Git Probing</text>
            <text x="74" y="136" class="node-role">
              [INSPECTOR] 
            </text>
            <text x="256" y="116" class="node-badge" fill="#94a3b8">
              ⏳
            </text>
          </g>
        
          <g onclick="inspectNode('step-2-triage')">
            <rect x="380" y="90" width="220" height="85"
                  class="node-card pending " />
            <text x="394" y="116" class="node-title">Root Cause Classification (Incident Inspector)</text>
            <text x="394" y="136" class="node-role">
              [INSPECTOR] 
            </text>
            <text x="576" y="116" class="node-badge" fill="#94a3b8">
              ⏳
            </text>
          </g>
        
          <g onclick="inspectNode('step-3a-planner')">
            <rect x="700" y="90" width="220" height="85"
                  class="node-card pending " />
            <text x="714" y="116" class="node-title">Synthesize Remediation Runbook (Remediation Planner)</text>
            <text x="714" y="136" class="node-role">
              [PLANNER] 
            </text>
            <text x="896" y="116" class="node-badge" fill="#94a3b8">
              ⏳
            </text>
          </g>
        
          <g onclick="inspectNode('step-3b-reviewer')">
            <rect x="700" y="205" width="220" height="85"
                  class="node-card pending " />
            <text x="714" y="231" class="node-title">Safety Audit & Policy Guardrail (Safety Reviewer)</text>
            <text x="714" y="251" class="node-role">
              [REVIEWER] 
            </text>
            <text x="896" y="231" class="node-badge" fill="#94a3b8">
              ⏳
            </text>
          </g>
        
          <g onclick="inspectNode('step-4-gate')">
            <rect x="1020" y="90" width="220" height="85"
                  class="node-card pending gate" />
            <text x="1034" y="116" class="node-title">Execute Remediation & Verify Recovery Gate</text>
            <text x="1034" y="136" class="node-role">
              [GATE] 
            </text>
            <text x="1216" y="116" class="node-badge" fill="#94a3b8">
              ⏳
            </text>
          </g>
        
          <g onclick="inspectNode('step-5-post-mortem')">
            <rect x="1340" y="90" width="220" height="85"
                  class="node-card pending " />
            <text x="1354" y="116" class="node-title">Synthesize Incident Post-Mortem & Export Kanban</text>
            <text x="1354" y="136" class="node-role">
              [COORDINATOR] 
            </text>
            <text x="1536" y="116" class="node-badge" fill="#94a3b8">
              ⏳
            </text>
          </g>
        
      </g>
    </svg>
  </div>

  <div id="drawer">
    <div class="drawer-header">
      <h3 id="drawer-title">Node Inspector</h3>
      <button onclick="closeDrawer()">✕</button>
    </div>
    <div id="drawer-content"></div>
  </div>

  <script>
    const nodes = [{"id":"step-1-probe","name":"Deterministic Telemetry & Git Probing","phaseId":"phase-1-detection","phaseName":"Detection & Telemetry Probing","role":"inspector","type":"probe","status":"pending","dependsOn":[],"x":60,"y":90,"width":220,"height":85},{"id":"step-2-triage","name":"Root Cause Classification (Incident Inspector)","phaseId":"phase-2-triage","phaseName":"Triage & Root Cause Analysis","role":"inspector","type":"probe","status":"pending","dependsOn":["step-1-probe"],"x":380,"y":90,"width":220,"height":85},{"id":"step-3a-planner","name":"Synthesize Remediation Runbook (Remediation Planner)","phaseId":"phase-3-plan-review","phaseName":"Remediation Synthesis & Safety Pair Review","role":"planner","type":"action","status":"pending","dependsOn":["step-2-triage"],"x":700,"y":90,"width":220,"height":85},{"id":"step-3b-reviewer","name":"Safety Audit & Policy Guardrail (Safety Reviewer)","phaseId":"phase-3-plan-review","phaseName":"Remediation Synthesis & Safety Pair Review","role":"reviewer","type":"action","status":"pending","dependsOn":["step-3a-planner"],"x":700,"y":205,"width":220,"height":85},{"id":"step-4-gate","name":"Execute Remediation & Verify Recovery Gate","phaseId":"phase-4-exec-gate","phaseName":"Execution & Verification Test Gate","role":"gate","type":"gate","status":"pending","dependsOn":["step-3b-reviewer"],"x":1020,"y":90,"width":220,"height":85},{"id":"step-5-post-mortem","name":"Synthesize Incident Post-Mortem & Export Kanban","phaseId":"phase-5-post-mortem","phaseName":"Post-Mortem Synthesis & Live Dashboard Export","role":"coordinator","type":"action","status":"pending","dependsOn":["step-4-gate"],"x":1340,"y":90,"width":220,"height":85}];
    let scale = 1, panX = 0, panY = 0, isDragging = false, startX, startY;
    const group = document.getElementById('transform-group');
    const container = document.getElementById('canvas-container');

    container.addEventListener('mousedown', e => {
      if (e.target.tagName === 'button' || e.target.closest('#drawer')) return;
      isDragging = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => isDragging = false);

    container.addEventListener('wheel', e => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      scale = Math.min(Math.max(scale * zoomFactor, 0.2), 3.0);
      updateTransform();
    });

    function updateTransform() {
      group.setAttribute('transform', `translate(${panX}, ${panY}) scale(${scale})`);
    }

    function resetZoom() {
      scale = 1; panX = 0; panY = 0;
      updateTransform();
    }

    function inspectNode(id) {
      const node = nodes.find(n => n.id === id);
      if (!node) return;
      document.getElementById('drawer-title').innerText = node.name;
      document.getElementById('drawer-content').innerHTML = `
        <p><strong>Role:</strong> ${node.role}</p>
        <p><strong>Status:</strong> ${node.status}</p>
        <p><strong>Phase:</strong> ${node.phaseName}</p>
        <p><strong>Duration:</strong> ${node.durationMs || 0}ms</p>
        <h4 style="margin-top:16px;">Inputs</h4>
        <pre>${JSON.stringify(node.inputs || {}, null, 2)}</pre>
        <h4 style="margin-top:16px;">Outputs</h4>
        <pre>${JSON.stringify(node.outputs || {}, null, 2)}</pre>
      `;
      document.getElementById('drawer').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open');
    }

    function toggleLang() {
      const url = new URL(window.location);
      url.searchParams.set('lang', 'en');
      window.location = url.toString();
    }
  </script>
</body>
</html>

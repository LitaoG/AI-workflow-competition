# AI-Workflow CI — mirrors the local gate chain (AGENTS.md §四) on Linux.
#
# Restored 2026-11-14 by user decision (Issue #7): the competition repo is
# PUBLIC, so GitHub Actions usage is free (runner minutes are billed for
# private repositories only) and Linux-side verification had zero coverage.
# The original removal (2026-11-09, Issue #203) was driven by private-repo
# quota exhaustion; that constraint no longer applies here.
#
# Merge admission is still governed by the local gates + pr_review_gate.mjs;
# this workflow is the public trust signal and the cross-platform check.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc)
        run: npm run build

      - name: Unit suite
        run: npm run test:unit

      - name: Integration suite (serial)
        run: npm run test:integration

      - name: Property-based tests
        run: npm run test:pbt

      - name: Governance locks
        run: npm run test:governance

      - name: E2E suite
        run: npm run test:e2e

      - name: Adversarial suite
        run: npm run test:adversarial

      - name: Nine-act demo (offline, self-verifying)
        run: bash scripts/demo.sh
